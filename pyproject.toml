[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antios"
version = "2.1.0-beta.1"
description = "Project Agent OS for Universal Engineering Governance & Autonomous Development"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "AntiOS Core Team"}
]
dependencies = []
keywords = ["antigravity", "ai-agents", "governance", "verification", "maker-checker", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
antios = "framework.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["framework*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
norecursedirs = ["fixtures", "tests/fixtures"]